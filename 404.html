<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Lumineo.ai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .error-page__code {
            font-family: var(--font-heading);
            font-size: clamp(8rem, 20vw, 16rem);
            font-weight: 700;
            line-height: 1;
            background: var(--color-accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            opacity: 0.15;
            position: absolute;
            z-index: 0;
        }
        .error-page__content {
            position: relative;
            z-index: 1;
        }
        .error-page__title {
            font-family: var(--font-heading);
            font-size: clamp(1.5rem, 3vw, 2.5rem);
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .error-page__text {
            color: var(--color-text-secondary);
            margin-bottom: 2rem;
            font-size: 1.05rem;
        }
    </style>
</head>
<body>
    <header class="header" id="header">
        <nav class="nav">
            <a href="index.html" class="nav__logo">
                <svg class="nav__logo-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="1.5"/>
                    <circle cx="20" cy="20" r="8" fill="currentColor" opacity="0.6"/>
                    <circle cx="20" cy="20" r="3" fill="currentColor"/>
                </svg>
                <span>lumineo<span class="accent">.ai</span></span>
            </a>
        </nav>
    </header>
    <section class="error-page">
        <div class="hero__bg">
            <div class="hero__grid-lines"></div>
            <div class="hero__gradient-orb hero__gradient-orb--1"></div>
        </div>
        <span class="error-page__code">404</span>
        <div class="error-page__content">
            <h1 class="error-page__title">Page not found</h1>
            <p class="error-page__text">The page you're looking for doesn't exist or has been moved.</p>
            <a href="index.html" class="btn btn--primary">Back to Home</a>
        </div>
    </section>
</body>
</html>
